# Three vlRelay core nodes on one MinIO bucket, with peer mTLS
# (docs/operations/deploy.md "A cluster"). One machine stands in for three
# here. On real hosts each node runs the same service with its own name,
# certificate and private address.
#
#   cd deploy/cluster
#   ./certs.sh                      # pki/: the CA and a certificate per node
#   export VLRELAY_INTERNAL_TOKEN=$(openssl rand -hex 32) VLRELAY_ADMIN_TOKEN=$(openssl rand -hex 16)
#   UPSTREAM=morel.us-east.host.bsky.network docker compose up -d --build
#   docker compose --profile followers up -d     # adds an edge and a replica
#
# Every node serves the same stream with the same seqs, so consumers can use
# any of 127.0.0.1:2981-2983 (or a load balancer over them) and resume on
# another node with their cursor.
name: vlrelay-cluster

x-relay: &relay
  build:
    context: ../../..
    dockerfile: vlrelay/Dockerfile
  image: ${VLRELAY_IMAGE:-vlrelay:local}
  depends_on:
    minio-init:
      condition: service_completed_successfully
  restart: unless-stopped
  ulimits:
    nofile: 1048576
  # a SIGTERM'd core hands its host and DID shards over before it exits
  stop_grace_period: 30s

x-env: &env
  VLRELAY_S3_ENDPOINT: http://minio:9000
  VLRELAY_S3_BUCKET: vlrelay
  VLRELAY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  VLRELAY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  VLRELAY_PEER_LISTEN: 0.0.0.0:2979
  VLRELAY_PEER_TLS_DIR: /etc/vlrelay/tls
  VLRELAY_INTERNAL_TOKEN: ${VLRELAY_INTERNAL_TOKEN:?set VLRELAY_INTERNAL_TOKEN (shared by every peer)}
  VLRELAY_ADMIN_TOKEN: ${VLRELAY_ADMIN_TOKEN:?set VLRELAY_ADMIN_TOKEN (the dashboard password)}

services:
  minio:
    build:
      context: ../../../vlpds/build
      dockerfile: Dockerfile.minio
    image: vlpds-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30

  minio-init:
    image: vlpds-minio:local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null
      && mc mb -p local/vlrelay >/dev/null && echo bucket vlrelay ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  n1:
    <<: *relay
    environment:
      <<: *env
      VLRELAY_NODE_ID: n1
      VLRELAY_ADVERTISE_URL: https://n1:2979
    # --host and --crawl work on any core: the host registry is in the
    # bucket, and each host connects on the node that owns its host shard
    command: [--role, core, --host, "${UPSTREAM:?set UPSTREAM to a PDS hostname to subscribe to}", --crawl]
    volumes:
      - ./pki/n1:/etc/vlrelay/tls:ro
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:2981:2980"

  n2:
    <<: *relay
    environment:
      <<: *env
      VLRELAY_NODE_ID: n2
      VLRELAY_ADVERTISE_URL: https://n2:2979
    command: [--role, core, --crawl]
    volumes:
      - ./pki/n2:/etc/vlrelay/tls:ro
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:2982:2980"

  n3:
    <<: *relay
    environment:
      <<: *env
      VLRELAY_NODE_ID: n3
      VLRELAY_ADVERTISE_URL: https://n3:2979
    command: [--role, core, --crawl]
    volumes:
      - ./pki/n3:/etc/vlrelay/tls:ro
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:2983:2980"

  # An edge follows every core's log over peer mTLS (~300 ms behind the
  # cores). It has no lease or shards, so it adds egress without adding ingest.
  edge:
    <<: *relay
    profiles: [followers]
    environment:
      <<: *env
      VLRELAY_NODE_ID: edge
      VLRELAY_ADVERTISE_URL: https://edge:2979
    command: [--role, edge]
    volumes:
      - ./pki/edge:/etc/vlrelay/tls:ro
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:2984:2980"

  # A replica reads the logs from the bucket and needs nothing else: no
  # certificate, no token, and read-only bucket credentials would do.
  replica:
    <<: *relay
    profiles: [followers]
    environment:
      VLRELAY_S3_ENDPOINT: http://minio:9000
      VLRELAY_S3_BUCKET: vlrelay
      VLRELAY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      VLRELAY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      VLRELAY_NODE_ID: replica
    command: [--role, replica]
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:2985:2980"

volumes:
  minio-data:
