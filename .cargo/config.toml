# Local builds target this machine's CPU. Container/cross builds should
# override (e.g. RUSTFLAGS="-C target-cpu=neoverse-v2" for Graviton 4).
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]
