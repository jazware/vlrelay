[package]
name = "vlrelay"
version = "0.1.0"
edition = "2024"
description = "An atproto relay whose only durable state is an object store"
license = "MIT"
publish = false

[dependencies]
# vlpds's library: the log, segments, merger, leases, store, slots, limiter,
# crypto, MST, CAR and DID resolution. Factored into shared crates once the
# relay settles which pieces it needs.
# the public vlpds at the commit this one was exported against
vlpds = { git = "https://github.com/jazware/vlpds", rev = "2778ca6a58d5c5ba19133072dc9e6f703cdd1ab0" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros", "http2"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
lru = "0.12"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
slatedb = { version = "0.17", features = ["aws", "wal_disable", "zstd", "lz4"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
mime_guess = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# dev tools (src/bin/e2e_check.rs, src/bin/devnet.rs). Features match
# vlpds's exactly: a different feature set would rebuild these and vlpds.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
hdrhistogram = "7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-tungstenite = { version = "0.26", features = ["__rustls-tls", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
# relay log and serving (src/seq.rs, src/serve.rs)
object_store = { version = "0.14", features = ["aws"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# signature verification (src/verify.rs): crates and features vlpds already builds
secp256k1 = { version = "0.30", features = ["global-context"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ring = "0.17"
bs58 = "0.5"

[[bin]]
name = "vlrelay"
path = "src/main.rs"

# Compares a relay's firehose with its upstreams' (docs/devloop.md)
[[bin]]
name = "e2e_check"
path = "src/bin/e2e_check.rs"

# Seeds and loads the local network (docs/devloop.md)
[[bin]]
name = "devnet"
path = "src/bin/devnet.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# differential tests against a second atproto implementation, as vlpds does
shrike = { version = "=0.7.0", default-features = false, features = ["syntax", "cbor", "crypto", "mst", "repo", "car", "sync"] }

[patch.crates-io]
slatedb = { git = "https://github.com/jazware/slatedb", rev = "2a79077e0da057c4673137195409edfe7bb673c4" }
slatedb-common = { git = "https://github.com/jazware/slatedb", rev = "2a79077e0da057c4673137195409edfe7bb673c4" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.dev-release]
inherits = "release"
opt-level = 2
lto = false
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev-release.package."*"]
opt-level = 3

# The relay crate itself at opt-level 0 with line tables: an edit in a
# vlpds-sized crate rebuilds and links in ~4 s this way against ~45 s at
# opt-level 1-2 (docs/devloop.md "Build speed"). Dependencies stay at 2, so
# crypto, CBOR and the MST aren't slow in dev runs. Only this crate's
# settings change, so switching rebuilds no dependency.
[profile.dev]
opt-level = 0

[profile.dev.package.vlrelay]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0
debug = 0
lto = false
codegen-units = 256

[profile.test.package."*"]
opt-level = 2
codegen-units = 16
