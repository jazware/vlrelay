[package]
name = "vlrelay"
version = "0.1.0"
edition = "2024"
description = "An atproto relay whose only durable state is an object store"
license = "MIT"
publish = false

[dependencies]
# What vlRelay shares with vlpds: the store, segments and slots, the log
# layout, the firehose merger and backfill (vlsync); CBOR, CIDs,
# the MST, CARs, crypto and DID resolution (vlatproto).
vlsync-store = { git = "https://github.com/jazware/vlsync", rev = "0769b290d9c278c980a1167201c90539125da206", features = ["jemalloc"] }
vlatproto = { git = "https://github.com/jazware/vlatproto", rev = "186c75bfd8b10e800f08586cbb69804e709d6ce1" }
vlsync-firehose = { git = "https://github.com/jazware/vlsync", rev = "0769b290d9c278c980a1167201c90539125da206" }
# SlateDB metrics with a `db` label per database, and each one's shape for
# GET /admin/api/store
slate-metrics = { git = "https://github.com/jazware/vlsync", rev = "0769b290d9c278c980a1167201c90539125da206" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros", "http2"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
lru = "0.18"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# the SlateDB fork every vlsync user builds against (its Cargo.toml lists the patches)
slatedb = { package = "vlsync-slatedb", git = "https://github.com/jazware/vlsync", rev = "0769b290d9c278c980a1167201c90539125da206" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
mime_guess = "2"
prometheus = { version = "0.14", default-features = false }
# the relay binary's allocator, as vlpds's server (libc malloc/free were ~13% of a loaded node's samples)
tikv-jemallocator = "0.7"
# the PLC export's memory budget reads jemalloc's allocated bytes
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
# the flush hands its freed segment buffers back (arena.<all>.purge)
tikv-jemalloc-sys = { version = "0.7", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# dev tools (src/bin/e2e_check.rs, src/bin/devnet.rs). Features match
# vlsync's exactly: a different feature set would rebuild these and vlsync.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
# getrusage, for the dashboard's CPU per node
libc = "0.2"
hdrhistogram = "7"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "http2", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
# relay log and serving (src/seq.rs, src/serve.rs)
object_store = { version = "0.14", features = ["aws"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# signature verification (src/verify.rs): secp256k1 as vlatproto builds it, and P-256
secp256k1 = { version = "0.33", features = ["global-context"] }
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
ring = "0.17"
bs58 = "0.5"
foldhash = "0.2"
# the qlog commitlog's record checksums
crc32fast = "1"
# SlateDB checkpoint ids (the qlog flush manifest names one)
uuid = "1"

# tokio-console (TOKIO_CONSOLE_BIND, docs/operations/monitoring.md) in
# builds with --cfg tokio_unstable: the images set it. Plain builds don't
# compile it in.
[target.'cfg(tokio_unstable)'.dependencies]
console-subscriber = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["tracing"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[features]
# jemalloc built with heap profiling: off until the process starts with
# _RJEM_MALLOC_CONF=prof:true,... (docs/operations/configuration.md "A small box")
heap-profiling = ["tikv-jemallocator/profiling"]

[[bin]]
name = "vlrelay"
path = "src/main.rs"

# Compares a relay's firehose with its upstreams' (docs/devloop.md)
[[bin]]
name = "e2e_check"
path = "src/bin/e2e_check.rs"

# Seeds and loads the local network (docs/devloop.md)
[[bin]]
name = "devnet"
path = "src/bin/devnet.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
# differential tests against a second atproto implementation, as vlpds does
shrike = { version = "=0.7.0", default-features = false, features = ["syntax", "cbor", "crypto", "mst", "repo", "car", "sync"] }

[profile.release]
opt-level = 3
# thin: a fat-LTO link held a CI builder core for ~3 min per image build
lto = "thin"
codegen-units = 16
debug = 1

[profile.dev-release]
inherits = "release"
opt-level = 2
lto = false
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev-release.package."*"]
opt-level = 3

# The relay crate itself at opt-level 0 with line tables: an edit in a
# vlpds-sized crate rebuilds and links in ~4 s this way against ~45 s at
# opt-level 1-2 (docs/devloop.md "Build speed"). Dependencies stay at 2, so
# crypto, CBOR and the MST aren't slow in dev runs. Only this crate's
# settings change, so switching rebuilds no dependency.
[profile.dev]
opt-level = 0

[profile.dev.package.vlrelay]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0
debug = 0
lto = false
codegen-units = 256

[profile.test.package."*"]
opt-level = 2
codegen-units = 16
