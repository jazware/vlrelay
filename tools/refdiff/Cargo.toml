[package]
name = "refdiff"
version = "0.1.0"
edition = "2024"
description = "Diffs the production relay's firehose against PDS firehoses: missing events, per-DID order, PDS-to-relay latency, frame sizes"
license = "MIT"
publish = false

# Standalone on purpose: it only reads frames, so it skips vlpds's ~2.5 min
# build and its slatedb patch.
[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hdrhistogram = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
debug = 1
