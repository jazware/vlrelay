# The docker half of the local network (docs/devloop.md): MinIO for the
# relay's bucket, a PLC directory, and the reference PDS. The vlpds upstreams
# run natively (dev/up.sh). Images are shared with vlpds's bench/migrate and
# build/, so a machine that ran those builds nothing here. Every container is
# memory-capped, and data lives in tmpfs: `down` leaves nothing behind.
name: vlrelay-dev

services:
  minio:
    build:
      context: ../../vlpds/build
      dockerfile: Dockerfile.minio
    image: vlpds-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs: /data
    mem_limit: 1g
    ports:
      - "127.0.0.1:${MINIO_PORT:-2990}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-2991}:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 1s
      retries: 60

  minio-init:
    image: vlpds-minio:local
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null && mc mb -p local/vlrelay >/dev/null && echo bucket vlrelay ready"

  plc-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    tmpfs: /var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30

  # did-method-plc publishes amd64-only images; built from source so it runs natively
  plc:
    build:
      context: https://github.com/did-method-plc/did-method-plc.git#9c8ea2fe23b89a5c1011246cbb4957dad9dbf7db
      dockerfile: packages/server/Dockerfile
    image: vlpds-migrate-plc:9c8ea2f
    depends_on:
      plc-db:
        condition: service_healthy
    environment:
      DB_CREDS_JSON: '{"host":"plc-db","password":"postgres"}'
      DB_MIGRATE_CREDS_JSON: '{"host":"plc-db","password":"postgres"}'
      ENABLE_MIGRATIONS: "true"
      PORT: "2582"
    mem_limit: 512m
    ports:
      - "127.0.0.1:${PLC_PORT:-2982}:2582"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2582/_health"]
      interval: 1s
      retries: 60

  # The reference PDS (bluesky-social/atproto packages/pds), dev mode: its
  # public URL is http://localhost:$REF_PDS_PORT and its handles end in .test.
  ref-pds:
    image: ghcr.io/bluesky-social/pds:${REF_PDS_TAG:-0.4}
    depends_on:
      plc:
        condition: service_healthy
    environment:
      PDS_HOSTNAME: localhost
      PDS_PORT: "${REF_PDS_PORT:-2983}"
      PDS_DEV_MODE: "true"
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_JWT_SECRET: dev-jwt-secret
      PDS_ADMIN_PASSWORD: dev-admin
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: 3b4e3e9a5d2f4c1b8e7a6d5c4b3a29181716151413121110f0e0d0c0b0a09080
      PDS_DID_PLC_URL: http://plc:2582
      PDS_INVITE_REQUIRED: "false"
      # no relay is ever told about this PDS
      PDS_CRAWLERS: ""
      PDS_BSKY_APP_VIEW_URL: http://127.0.0.1:9
      PDS_BSKY_APP_VIEW_DID: did:web:appview.invalid
      PDS_RATE_LIMITS_ENABLED: "false"
      LOG_ENABLED: "false"
    tmpfs: /pds
    mem_limit: 1g
    ports:
      - "127.0.0.1:${REF_PDS_PORT:-2983}:${REF_PDS_PORT:-2983}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${REF_PDS_PORT:-2983}/xrpc/_health"]
      interval: 1s
      retries: 60
