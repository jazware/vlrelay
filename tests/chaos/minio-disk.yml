# MinIO on a docker volume instead of tmpfs, for runs longer than a few
# minutes: tmpfs counts against the container's 1 GB cap, and a soak at
# ~1k events/s fills it in ~13 minutes (MinIO OOM-killed). Used through
# DEV_COMPOSE_EXTRA (dev/up.sh); `dev/down.sh` removes the volume.
services:
  minio:
    command: server /disk --console-address ":9001"
    mem_limit: 2g
    volumes:
      - minio-disk:/disk

volumes:
  minio-disk: {}
